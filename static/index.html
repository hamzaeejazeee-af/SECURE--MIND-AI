<script>
/* Server AI connector. The page asks its own server (/api/chat); the API key lives on the server
   (GROQ_API_KEY in .env or in the host's Environment settings) and is never sent to the browser. */
(function () {
  if (window.claude && window.claude.use) return;
  function err(msg, code) { var e = new Error(msg); e.code = code || 'user'; e.message = msg; return e; }
  async function readJSON(r) { try { return await r.json(); } catch (e) { return {}; } }
  var healthP = null;
  function health() {
    if (!healthP) healthP = fetch('/api/health').then(readJSON).catch(function () { return {}; });
    return healthP;
  }
  async function run(prompt, o) {
    o = o || {};
    var r;
    try {
      r = await fetch('/api/chat', {
        method: 'POST', signal: o.signal, headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] })
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw err('Could not reach the server. Check your internet and try again.');
    }
    var j = await readJSON(r);
    if (!r.ok || j.error) {
      var m = j.error || ('Server error ' + r.status);
      throw err(m, /limit reached|too many/i.test(String(m)) ? 'rate_limited' : 'user');
    }
    var res = { text: j.text || '', truncated: false };
    if (o.onText) { try { o.onText({ text: res.text }); } catch (e) {} }
    return res;
  }
  function extractJSON(t) {
    t = String(t || '').replace(/```json|```/g, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }
  function makeSample() {
    var f = function (prompt, o) { return run(prompt, o); };
    f.json = async function (prompt, o) {
      var r = await run(prompt, o), obj = extractJSON(r.text);
      if (!obj) { r = await run(prompt + '\n\nReply with ONLY the JSON object. No markdown fences, no commentary.', o); obj = extractJSON(r.text); }
      if (!obj) throw { code: 'invalid_json', message: 'The AI reply could not be read as data.' };
      return obj;
    };
    f.limits = async function () { return {}; };
    return f;
  }
  var downloads = {
    save: async function (o) {
      var b = new Blob([o.data], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = o.filename || 'export.txt';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };
  window.claude = {
    isShim: true,
    use: async function (name) {
      if (name === 'sample') {
        var h = await health();
        return (h.groq || h.xai || h.gemini || h.claude || h.ollama) ? makeSample() : null;
      }
      if (name === 'downloads') return downloads;
      return null;
    }
  };
})();
</script>

<script>
const ROLES=["University Student","Teacher","Office Employee","Business Owner","General Internet User"];
const TOPICS=["Phishing and email scams","Password security","Social engineering","Malware and suspicious attachments","Online shopping scams","Social media privacy","Data protection","Safe use of AI tools"];
const LEVELS=["Beginner","Intermediate","Advanced"];
const NAV=[["dash","Dashboard"],["train","AI Training"],["phish","Phishing Lab"],["quiz","Quiz Center"],["coach","AI Coach"],["prog","My Progress"],["tests","Evaluation & Testing"],["set","Settings"],["about","About"]];
const KEY="cyber_coach_v1";
let S={name:"",role:ROLES[0],log:[]},view="dash",storageOK=true,aiP=null,aiReady=null,confirmClear=false;
let lastErr=null,aiMsg="",PC=null,pBusy=false,pErr="",declined=false,aiOK=false;
const logo=(z,id)=>brainSVG(z,id,"mini");
const CR="\u00a9 2026 Abdul Hannan. All rights reserved.";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=x=>Array.isArray(x)?x:[];
function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);S=sanitize(o)}}catch(e){storageOK=false}}
function sanitize(o){o=o||{};return{name:String(o.name||"").slice(0,40),role:ROLES.includes(o.role)?o.role:ROLES[0],log:L(o.log),chats:L(o.chats).filter(c=>c&&/^\w+$/.test(c.id)&&L(c.msgs).length).slice(0,20).map(c=>({id:c.id,title:String(c.title||"Chat").slice(0,40),date:String(c.date||new Date().toISOString()),msgs:c.msgs.slice(-80)}))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){storageOK=false;return false}}
function add(type,topic,x){S.log.unshift(Object.assign({type,topic,date:new Date().toISOString()},x||{}));save()}
const quizzes=()=>S.log.filter(l=>l.type==="quiz");
const avgQuiz=()=>{const q=quizzes();return q.length?Math.round(q.reduce((a,b)=>a+b.pct,0)/q.length):null};
const levelOf=a=>a==null?"Not assessed yet":a<40?"Beginner":a<70?"Intermediate":"Advanced";
function topicStats(){const m={};quizzes().forEach(q=>{(m[q.topic]=m[q.topic]||[]).push(q.pct)});return Object.entries(m).map(([t,v])=>[t,Math.round(v.reduce((a,b)=>a+b,0)/v.length)])}
function applyRole(st,r){return ROLES.includes(r)?Object.assign({},st,{role:r}):st}
function validateTraining(r,t,l){if(!r||!t||!l)return"Please choose a role, a topic and a difficulty level before generating training.";return null}
function scoreQuiz(qs,ans){let c=0;qs.forEach((q,i)=>{if(ans[i]===q.a)c++});return{correct:c,total:qs.length,pct:qs.length?Math.round(100*c/qs.length):0}}
const answerFeedback=(q,a)=>a===q.a?"Correct. "+q.e:"Incorrect. The right answer is \""+q.o[q.a]+"\". "+q.e;
function toCSV(st){const qz=st.log.filter(l=>l.type==="quiz"),av=qz.length?Math.round(qz.reduce((a,b)=>a+b.pct,0)/qz.length):"";const q=c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"';const rows=[["Date","Type","Topic","Detail","Score %"]];st.log.slice().reverse().forEach(l=>rows.push([l.date.slice(0,10),l.type,l.topic||"",l.detail||(l.level||""),l.pct==null?"":l.pct]));return"Report,SecureMind AI - Cybersecurity Awareness Coach\nCopyright,\"(c) 2026 Abdul Hannan. All rights reserved.\"\nName,"+q(st.name||"(not set)")+"\nRole,"+q(st.role)+"\nQuizzes completed,"+qz.length+"\nAverage quiz score %,"+av+"\nTotal activities,"+st.log.length+"\n\n"+rows.map(r=>r.map(q).join(",")).join("\n")}
function nextRec(){const ts=topicStats().filter(t=>t[1]<70&&TOPICS.includes(t[0])).sort((a,b)=>a[1]-b[1]);if(ts.length)return{t:ts[0][0],why:"Your quiz average here is "+ts[0][1]+"%."};const done=S.log.filter(l=>l.type==="training").map(l=>l.topic);const n=TOPICS.find(t=>!done.includes(t));return n?{t:n,why:"You have not trained on this topic yet."}:{t:TOPICS[0],why:"Review a topic at a higher difficulty."}}

// ---------- AI ----------
function getAI(){if(!aiP){aiP=(async()=>{try{return window.claude?await window.claude.use("sample"):null}catch(e){return null}})().then(a=>{aiReady=!!a;const s=$("aist");if(s)s.innerHTML=aiBadge();return a})}return aiP}
const aiBadge=()=>aiReady===null?'<span class="tag"><i class="dot a"></i>Live AI: checking...</span>':aiReady?(aiOK?'<span class="tag"><i class="dot g"></i>Live AI: working (verified this session)</span>':'<span class="tag w"><i class="dot a"></i>Live AI: detected, not verified yet - tap Test AI connection</span>'):'<span class="tag w"><i class="dot r"></i>Live AI: unavailable (fallback mode)</span>';
